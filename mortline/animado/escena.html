<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
/* Las variables (--bg, --fg, --acc...) las pone iniciar() según el estilo visual (mortline/temas.py). */
:root{--cw:900px;--viol:#8B2CFF;--hlfg:#fff;--hlb:#000;--hlbf:#fff;--ls:0em;--rw:22px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:var(--bf),sans-serif;color:var(--fg);position:relative;font-synthesis:none}
#fondo,#escenas{position:absolute;inset:0}
#fondo>*{position:absolute}
.escena{position:absolute;inset:0;display:none;transform-origin:500px 650px}
.zona{position:absolute;left:50px;width:900px;top:450px;height:800px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pal{display:inline-block;position:relative;white-space:pre;will-change:transform;isolation:isolate}
.pal.hl{color:var(--hl)}
.pal.hl::before,.pal.hl::after{content:"";position:absolute;pointer-events:none;transform-origin:left center;transform:scaleX(var(--w,0))}
.pal.hl::before{display:none}
.pal.hl::after{left:0;right:0;bottom:-2px;height:.09em;border-radius:99px;background:var(--hl)}
.pal.tach::after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:.1em;background:var(--acc);transform-origin:left center;transform:scaleX(var(--w,0));border-radius:99px}
svg.ic{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{width:190px;height:190px;border-radius:min(95px,calc(var(--rc)*2.4));display:flex;align-items:center;justify-content:center;
 background:var(--acc);color:var(--onacc);border:var(--bw) solid var(--cardb);box-shadow:var(--sh);margin-bottom:40px}
.badge .i{width:108px;height:108px}
.linea{font-family:var(--df);font-weight:var(--dpeso);text-align:center;line-height:1.08;letter-spacing:var(--ls);width:900px}
/* pasos */
.paso{width:var(--cw);height:200px;border-radius:var(--rc);background:var(--card);border:var(--bw) solid var(--cardb);box-shadow:var(--sh);
 display:flex;align-items:center;padding:0 38px;margin:14px 0;gap:34px}
.paso .n{flex:0 0 100px;height:100px;border-radius:50%;background:var(--acc);color:var(--onacc);font-family:var(--df);font-weight:var(--dpeso);font-size:62px;
 display:flex;align-items:center;justify-content:center;padding-top:4px}
.paso .t{font-family:var(--df);font-weight:var(--dpeso);line-height:1.05;flex:1;min-width:0}
.paso.ult{border-color:var(--acc)}
/* flujo */
.caja{width:calc(var(--cw) - 20px);height:220px;border-radius:var(--rc);background:var(--card);border:var(--bw) solid var(--cardb);box-shadow:var(--sh);display:flex;align-items:center;gap:34px;padding:0 40px}
.caja .i{flex:0 0 112px;height:112px;border-radius:calc(var(--rc)*.7);background:var(--cli);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.caja .i svg{width:64px;height:64px}
.caja .t{font-family:var(--df);font-weight:var(--dpeso);line-height:1.05;flex:1;min-width:0}
.caja.fin{background:var(--acc);color:var(--onacc);border-color:var(--cardb)}
.caja.fin .i{background:rgba(255,255,255,.22);color:var(--onacc)}
.caja.fin .pal.hl,.paso.ult .pal.hl,.burb.yo .pal.hl{color:inherit!important}
.caja.fin .pal.hl::before,.caja.fin .pal.hl::after,.burb.yo .pal.hl::before,.burb.yo .pal.hl::after,.burb.hlb .pal.hl::before,.burb.hlb .pal.hl::after{display:none!important}
.flecha{width:90px;height:100px;flex:none;color:var(--acc)}
/* dato */
.aro{position:relative;width:740px;height:740px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.aro svg.r{position:absolute;inset:0;width:740px;height:740px;transform:rotate(-90deg)}
.aro circle{stroke-width:var(--rw)}
.aro circle.bg{stroke:var(--track)}
.aro circle.pr{stroke:var(--acc)}
.aro .num{font-family:var(--df);font-weight:var(--dpeso);line-height:1;white-space:nowrap}
.aro .num small{font-size:.5em;color:var(--mut);margin-left:.1em}
.aro .et{font-family:var(--bf);color:var(--mut);text-align:center;line-height:1.1;margin-top:14px;width:520px}
/* chat */
.cel{width:840px;height:770px;border-radius:min(70px,calc(var(--rc)*2.4));border:calc(var(--bw) + 4px) solid var(--cardb);background:var(--card);box-shadow:var(--sh);overflow:hidden;position:relative}
.cel .cab{height:120px;background:var(--cli);display:flex;align-items:center;gap:24px;padding:0 36px}
.cel .av{width:72px;height:72px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;color:var(--onacc)}
.cel .av svg{width:40px;height:40px}
.cel .nom{font-family:var(--df);font-weight:var(--dpeso);font-size:42px;line-height:1}
.cel .en{font-size:26px;color:var(--mut);margin-top:4px}
.burb{position:absolute;max-width:580px;padding:22px 32px;border-radius:calc(var(--rc)*1.3);font-family:var(--bf);line-height:1.15}
.burb.cli{left:32px;background:var(--cli);color:var(--fg);border-bottom-left-radius:6px;transform-origin:0 100%}
.burb.yo{right:32px;background:var(--acc);color:var(--onacc);border-bottom-right-radius:6px;transform-origin:100% 100%}
.burb.hlb{background:var(--hlb);color:var(--hlbf)}
.tipeo{position:absolute;left:32px;padding:22px 30px;border-radius:30px;background:var(--cli);display:flex;gap:12px}
.tipeo i{width:18px;height:18px;border-radius:50%;background:var(--mut);display:block}
/* grafico */
.graf{width:880px;height:760px;position:relative}
.graf .tit{position:absolute;left:0;right:0;top:0;text-align:center;font-family:var(--df);font-weight:var(--dpeso);line-height:1.05;letter-spacing:var(--ls)}
.barra{position:absolute;bottom:90px;width:180px;border-radius:calc(var(--rc)*.8) calc(var(--rc)*.8) 4px 4px;background:var(--acc);border:var(--bw) solid var(--cardb);box-shadow:var(--sh);transform-origin:50% 100%}
.barra.top{background:var(--hlb)}
.etq{position:absolute;bottom:0;width:205px;height:80px;text-align:center;font-family:var(--bf);color:var(--mut);line-height:1.05;display:flex;align-items:center;justify-content:center}
.graf svg.tend{position:absolute;left:0;top:0;width:880px;height:760px;overflow:visible}
.graf svg.tend path{stroke:var(--fg)}.graf svg.tend circle{fill:var(--fg)}
/* mito / verdad */
.mc{width:var(--cw);border-radius:var(--rc);background:var(--card);border:var(--bw) solid var(--cardb);box-shadow:var(--sh);padding:26px 40px 30px;margin:16px 0;position:relative}
.mc .etiq{font-family:var(--bf);font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:14px}
.mc .etiq svg{width:40px;height:40px;flex:none}
.mc .tx{font-family:var(--df);font-weight:var(--dpeso);line-height:1.08}
.mc.mito .tx{color:var(--mut)}
.mc.verdad{background:var(--acc);color:var(--onacc);border-color:var(--cardb)}
.mc.verdad .etiq{color:var(--onacc);opacity:.85}
.mc.verdad .pal.hl{color:inherit!important}.mc.verdad .pal.hl::before,.mc.verdad .pal.hl::after{display:none!important}
/* antes / después */
.ad{width:var(--cw);height:330px;border-radius:var(--rc);border:var(--bw) solid var(--cardb);box-shadow:var(--sh);padding:26px 40px;position:relative;display:flex;flex-direction:column;justify-content:center}
.ad.antes{background:var(--cli);color:var(--mut);margin-bottom:26px}
.ad.ahora{background:var(--acc);color:var(--onacc)}
.ad .etiq{font-family:var(--bf);font-size:34px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-bottom:8px;display:flex;align-items:center;gap:14px}
.ad .etiq svg{width:42px;height:42px}
.ad .tx{font-family:var(--df);font-weight:var(--dpeso);line-height:1.08}
.ad.antes .tx{opacity:.9}
.ad .pal.hl{color:inherit!important}.ad .pal.hl::before,.ad .pal.hl::after{display:none!important}
.ad.antes::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(0,0,0,.05) 22px 24px)}
/* ticket */
.tkw{position:relative;width:720px}
.tkw .ranura{height:34px;border-radius:17px;background:#2c2c2c;width:780px;margin-left:-30px;position:relative;z-index:2;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.tk{width:720px;background:#FCFBF6;color:#1A1A1A;font-family:CourierX,monospace;font-weight:700;padding:26px 40px 8px;position:relative;margin-top:-10px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.22))}
.tk .cab{text-align:center;line-height:1.1;padding-bottom:12px;border-bottom:4px dashed #1A1A1A;margin-bottom:12px}
.tk .fila{display:flex;justify-content:space-between;gap:20px;padding:10px 0;line-height:1.1;border-bottom:3px dotted rgba(26,26,26,.45)}
.tk .fila .a{flex:1;min-width:0}.tk .fila .b{white-space:nowrap}
.tk .tot{background:#1A1A1A;color:#FCFBF6;margin:16px -40px 0;padding:18px 40px;display:flex;justify-content:space-between;gap:20px;line-height:1.1}
.tk .zig{position:absolute;left:0;right:0;bottom:-22px;height:22px;background:linear-gradient(135deg,#FCFBF6 50%,transparent 50%) 0 0/24px 24px,linear-gradient(225deg,#FCFBF6 50%,transparent 50%) 0 0/24px 24px}
.tk .rell{height:22px}
/* celdas */
.hoja{width:900px;border:2px solid #C6C9CE;background:#fff;color:#202124;font-family:SpaceX,monospace;font-weight:700;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.2);border-radius:10px;overflow:hidden}
.hoja .fl{display:flex}
.hoja .c{border-right:2px solid #D9DCE0;border-bottom:2px solid #D9DCE0;display:flex;align-items:center;padding:0 22px;overflow:hidden;white-space:nowrap}
.hoja .cabc{background:#F1F3F4;color:#5F6368;justify-content:center;height:64px;font-size:30px}
.hoja .num{background:#F1F3F4;color:#5F6368;justify-content:center;width:70px;padding:0;font-size:30px;flex:none}
.hoja .ca{width:520px;flex:none}.hoja .cb{width:306px;flex:none;justify-content:flex-end}
.hoja .unica{width:826px;flex:none}
.hoja .sel{position:absolute;border:6px solid var(--acc);border-radius:4px;pointer-events:none;z-index:3}
.hoja .sel::after{content:"";position:absolute;right:-12px;bottom:-12px;width:18px;height:18px;background:var(--acc);border:3px solid #fff}
.hoja .ult .c:not(.num){background:color-mix(in srgb,var(--acc) 16%,#fff)}
.hoja .rell{height:0}
/* placa final: acá y solo acá va el violeta de la marca */
.placa{position:absolute;inset:0;display:none;background:radial-gradient(900px 900px at 25% 18%,rgba(139,44,255,.38),transparent 70%),radial-gradient(1000px 1000px at 85% 75%,rgba(98,30,190,.30),transparent 70%),linear-gradient(180deg,#1a0c36 0%,#0e0a16 100%),#0E0A16;color:#fff;font-family:HankenX,sans-serif}
.placa .logo{position:absolute;left:220px;top:330px;width:640px;height:640px;background:url(LOGO) center/ 112% no-repeat;mix-blend-mode:lighten;filter:brightness(1.1) contrast(1.35);
 -webkit-mask-image:radial-gradient(ellipse 72% 64% at 50% 52%,#000 68%,transparent 100%);mask-image:radial-gradient(ellipse 72% 64% at 50% 52%,#000 68%,transparent 100%)}
.placa .boton{position:absolute;left:130px;top:1080px;width:820px;height:136px;border-radius:68px;background:#fff;color:#17141F;font-weight:600;font-size:52px;display:flex;align-items:center;justify-content:center}
.placa .web{position:absolute;left:0;right:0;top:1290px;text-align:center;font-weight:800;font-size:96px;letter-spacing:-.02em}
.placa .link{position:absolute;left:0;right:0;top:1420px;text-align:center;font-weight:600;font-size:46px;color:#B9A8D9}
.placa .precio{position:absolute;left:0;right:0;top:960px;text-align:center;font-weight:800;font-size:58px;color:#C9A6FF}

/* ===== tratamiento propio de cada estilo ===== */
/* cuaderno: marcador amarillo, tinta azul, lapicera roja */
body.t-cuaderno{--hlb:#FFE04A;--hlbf:#1C2B4B}
body.t-cuaderno .pal.hl::after{display:none}
body.t-cuaderno .pal.hl::before{display:block;left:-6px;right:-6px;top:38%;bottom:-2px;background:#FFE04A;z-index:-1;border-radius:6px 14px 8px 12px}
body.t-cuaderno .linea{font-weight:400}
/* pizarra: tiza */
body.t-pizarra{--hlb:#FFD966;--hlbf:#1F3B31}
body.t-pizarra .linea,body.t-pizarra .pal{text-shadow:0 0 1.5px rgba(255,255,255,.5)}
body.t-pizarra .pal.hl::after{height:.07em;bottom:-6px;border-radius:0;background:repeating-linear-gradient(90deg,var(--hl) 0 18px,transparent 18px 24px)}
body.t-pizarra .badge{background:transparent;color:var(--acc);border-style:dashed}
body.t-pizarra .paso,body.t-pizarra .caja,body.t-pizarra .mc,body.t-pizarra .ad,body.t-pizarra .cel{border-style:dashed}
/* editorial: filetes y un acento rojo */
body.t-editorial{--hlb:#D7261E;--hlbf:#fff;--rw:6px}
body.t-editorial .badge{background:none;border:none;box-shadow:none;color:var(--acc);width:150px;height:150px;margin-bottom:34px}
body.t-editorial .badge .i{width:140px;height:140px}
body.t-editorial .paso,body.t-editorial .caja:not(.fin),body.t-editorial .mc.mito,body.t-editorial .ad.antes{border:none;border-top:3px solid #121212;border-bottom:1px solid #121212;background:none}
body.t-editorial .paso .n{border-radius:0;background:none;color:var(--acc);font-size:96px;flex-basis:80px}
body.t-editorial .caja .i{background:none}
body.t-editorial .cel{border-width:2px}
body.t-editorial .linea{letter-spacing:-.01em}
/* ticket: máquina de escribir, resaltado en negativo */
body.t-ticket{--hlb:#1A1A1A;--hlbf:#F8F6EF;--rw:10px}
body.t-ticket .linea,body.t-ticket .paso .t,body.t-ticket .caja .t,body.t-ticket .mc .tx,body.t-ticket .ad .tx{text-transform:uppercase}
body.t-ticket .pal.hl{color:var(--hlbf);padding:0 .12em}
body.t-ticket .pal.hl::after{display:none}
body.t-ticket .pal.hl::before{display:block;inset:2px 0 -2px 0;background:#1A1A1A;z-index:-1}
body.t-ticket .badge{border-radius:0;box-shadow:none;background:none;color:var(--fg);border:var(--bw) dashed var(--fg)}
body.t-ticket .paso,body.t-ticket .caja:not(.fin),body.t-ticket .mc.mito,body.t-ticket .ad.antes{border:none;border-bottom:4px dashed #1A1A1A;background:none}
body.t-ticket .paso .n{border-radius:0}
/* planilla: celda verde seleccionada */
body.t-planilla{--hlb:#1E8E3E;--hlbf:#fff;--rw:14px}
body.t-planilla .pal.hl{color:#137333}
body.t-planilla .pal.hl::after{display:none}
body.t-planilla .pal.hl::before{display:block;inset:-2px -10px -2px -10px;background:#E6F4EA;border:4px solid #1E8E3E;z-index:-1}
body.t-planilla .paso .n{border-radius:6px}
body.t-planilla .badge{border-radius:10px;box-shadow:none}
/* neón */
body.t-neon{--hlb:#FF3CAC;--hlbf:#06101C;--ls:.02em;--rw:12px}
body.t-neon .pal.hl{color:#FF3CAC;text-shadow:0 0 18px rgba(255,60,172,.85),0 0 4px rgba(255,60,172,.9)}
body.t-neon .pal.hl::after{display:none}
body.t-neon .linea,body.t-neon .paso .t,body.t-neon .caja .t,body.t-neon .mc .tx,body.t-neon .ad .tx,body.t-neon .tit{text-shadow:0 0 14px rgba(0,229,255,.55)}
body.t-neon .badge{background:transparent;color:var(--acc);box-shadow:0 0 30px rgba(0,229,255,.6),inset 0 0 24px rgba(0,229,255,.25)}
body.t-neon .paso .n{background:transparent;color:var(--acc);border:4px solid var(--acc);box-shadow:0 0 18px rgba(0,229,255,.6)}
body.t-neon .caja.fin,body.t-neon .mc.verdad,body.t-neon .ad.ahora{background:rgba(255,60,172,.12);color:var(--fg);border-color:#FF3CAC;box-shadow:0 0 30px rgba(255,60,172,.6)}
body.t-neon .caja.fin .i{color:#FF3CAC}
body.t-neon .mc.verdad .etiq,body.t-neon .ad .etiq{color:#FF3CAC}
body.t-neon .barra{box-shadow:0 0 26px rgba(0,229,255,.6)}
body.t-neon .barra.top{box-shadow:0 0 30px rgba(255,60,172,.7);border-color:#FF3CAC}
/* pop: collage con contornos negros */
body.t-pop{--hlb:#FF3D81;--hlbf:#fff;--rw:30px}
body.t-pop .pal.hl{color:#fff}
body.t-pop .pal.hl::after{display:none}
body.t-pop .pal.hl::before{display:block;inset:-2px -14px -6px -14px;background:#FF3D81;border:5px solid #111;border-radius:16px;z-index:-1;transform:scaleX(var(--w,0)) rotate(-2deg);box-shadow:5px 5px 0 #111}
body.t-pop .linea{-webkit-text-stroke:0;text-shadow:0 5px 0 rgba(255,255,255,.55)}
body.t-pop .badge{border-radius:50%}
body.t-pop .aro .num{-webkit-text-stroke:3px #111;color:#fff;text-shadow:7px 7px 0 #111}
/* minimal */
body.t-minimal{--hlb:#2B50FF;--hlbf:#fff;--rw:12px}
body.t-minimal .badge{border:none;border-radius:50%;box-shadow:none}
body.t-minimal .linea{letter-spacing:-.025em}
body.t-minimal .pal.hl::after{height:.07em;bottom:-4px}
/* palitos: papel, trazo negro grueso y un naranja */
body.t-palitos{--hlb:#F26A1B;--hlbf:#fff;--rw:10px}
body.t-palitos .badge{border-radius:50%}
body.t-palitos .pal.hl{color:#F26A1B}
body.t-palitos .pal.hl::after{height:.08em;bottom:-3px;background:#111}
</style></head>
<body>
<div id="fondo"></div>
<div id="escenas"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const salida=t=>1-Math.pow(1-clamp(t),3);
let MOV={tipo:"resorte",k:170,c:15,y:70,s:.8,r:0,giro:0},ESCALA=1;
// resorte amortiguado: 0 -> 1 con rebote, determinista en función del tiempo
function spring(t,k=170,c=15){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=c/(2*w0),wd=w0*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+z/Math.sqrt(1-z*z)*Math.sin(wd*t));
}
function put(el,o){
  const {x=0,y=0,s=1,r=0,a=1,cp=""}=o;
  el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  el.style.opacity=a;
  el.style.clipPath=cp;
}
// Entrada de un elemento: cada estilo tiene su propio lenguaje de movimiento.
function entra(el,lt,delay,o={}){
  const m=MOV,d=lt-delay;
  const x0=o.x??m.x??0,y0=o.y??m.y??0;
  let p,a=1,s=1,r=0,mx=0,my=0,cp="";
  switch(m.tipo){
    case"resorte":p=spring(d,o.k??m.k,o.c??m.c);a=clamp(d/.1);s=lerp(o.s??m.s,1,p);r=(1-p)*(o.r??m.r);mx=(1-p)*x0;my=(1-p)*y0;break;
    case"suave":p=salida(d/.6);a=clamp(d/.4);s=lerp(.97,1,p);mx=(1-p)*x0;my=(1-p)*y0;break;
    case"borrado":p=salida(d/.55);a=d>0?1:0;cp=`inset(-30px ${(1-p)*100}% -30px -30px)`;break;   // como escrito con tiza / celda que se llena
    case"escalon":p=Math.floor(clamp(d/.42)*6)/6;a=d>0?1:0;my=-(1-p)*Math.min(y0,70);cp=`inset(0 0 ${(1-p)*100}% 0)`;break;   // sale de a saltos, como una impresora
    case"parpadeo":{const q=d;p=salida(d/.35);a=q<0?0:q<.05?1:q<.09?.1:q<.15?1:q<.19?.3:1;s=lerp(.94,1,p);break}
  }
  put(el,{x:mx,y:my,s,r,a,cp});
  return p;
}
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ%$]/g,"");
function icono(n,def="sparkles"){return `<svg class="ic" viewBox="0 0 24 24">${(DATA.iconos[n]||DATA.iconos[def])}</svg>`}
function div(cls,html="",parent){const d=document.createElement("div");d.className=cls;d.innerHTML=html;if(parent)parent.appendChild(d);return d}
function inclina(el,i){if(MOV.giro)el.style.rotate=((i%2?1:-1)*MOV.giro)+"deg"}

// reduce el tamaño de letra hasta que el texto entre en la caja
function ajustar(el,maxW,maxH,px,min=28){
  px=Math.round(px*ESCALA);min=Math.round(min*Math.min(1,ESCALA));
  el.style.fontSize=px+"px";
  let n=0;
  while((el.scrollWidth>maxW+1||el.scrollHeight>maxH+1)&&px>min&&n++<90){px-=3;el.style.fontSize=px+"px"}

function palabras(el,texto,resaltar,porDefecto=false,clase="hl"){

  const toks=texto.split(/\s+/).filter(Boolean);
  let marca=toks.map(t=>set.has(norm(t)));
  if(clase==="tach")marca=toks.map(()=>true);
  else if(porDefecto&&!marca.some(Boolean)){let b=0;toks.forEach((t,i)=>{if(norm(t).length>=norm(toks[b]).length)b=i});marca[b]=true}
  const out=[];
  toks.forEach((t,i)=>{
    const s=document.createElement("span");s.className="pal"+(marca[i]?" "+clase:"");s.textContent=t;
    el.appendChild(s);
    if(i<toks.length-1)el.appendChild(document.createTextNode(" "));
    out.push(s);
  });
  return out;
}

palitos:{
  // Muñeco de palitos dibujado por código: cada pose son 11 puntos + accesorios; entre escenas se interpola con resorte.
  build(f){
    f.style.background="radial-gradient(circle,rgba(17,17,17,.10) 1.6px,transparent 2px) 0 0/40px 40px,var(--bg)";
    div("","",f).style.cssText="left:0;right:0;top:0;height:14px;background:#111";
    const NS="http://www.w3.org/2000/svg";
    const wrap=div("","",f);wrap.style.cssText="left:287px;top:84px;width:426px;height:330px";
    wrap.innerHTML=`<svg id="mu" viewBox="-100 0 400 310" width="426" height="330" fill="none" stroke="#111" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
<path id="suelo" d="M-60 296 Q40 288 100 296 T260 294" stroke-width="6" opacity=".35"/>
<polyline id="torso"/><polyline id="brI"/><polyline id="brD"/><polyline id="pI"/><polyline id="pD"/>
<circle id="cab" r="27" fill="#FBF8EF"/><circle id="oi" r="3.6" fill="#111" stroke="none"/><circle id="od" r="3.6" fill="#111" stroke="none"/><path id="boca" stroke-width="5"/>
<g id="gota" fill="#F26A1B" stroke="none"><path d="M0 0 Q-7 12 0 16 Q7 12 0 0Z"/></g>
<g id="gota2" fill="#F26A1B" stroke="none"><path d="M0 0 Q-6 10 0 13 Q6 10 0 0Z"/></g>
<text id="que" font-family="MarkerX" font-size="58" fill="#F26A1B" stroke="none">?</text>
<g id="cel"><rect x="-9" y="-15" width="18" height="30" rx="4" fill="#111"/><rect x="-5" y="-11" width="10" height="20" rx="2" fill="#F26A1B" stroke="none"/></g>
<g id="est" stroke="#F26A1B" stroke-width="6"><path id="e1"/><path id="e2"/><path id="e3"/><path id="e4"/></g>
<g id="pun" stroke="#F26A1B" stroke-width="6"><path d="M0 -12 L8 -22"/><path d="M6 0 L18 -2"/><path d="M0 12 L8 22"/></g>
<g id="mos"><rect x="-40" y="176" width="280" height="130" rx="6" fill="#fff"/><rect x="-40" y="176" width="280" height="20" fill="#F26A1B"/><rect x="150" y="120" width="70" height="56" rx="6" fill="#fff"/><rect x="160" y="130" width="50" height="20" fill="#111" stroke="none"/></g>
</svg>`;
    const q=id=>wrap.querySelector("#"+id);
    this.R={};["torso","brI","brD","pI","pD","cab","oi","od","boca","gota","gota2","que","cel","est","e1","e2","e3","e4","pun","mos","suelo"].forEach(k=>this.R[k]=q(k));
    // puntos: h cabeza, n cuello, c cadera, ei/mi codo y mano izq, ed/md der, ri/pi rodilla y pie izq, rd/pd der
    const P=(h,ei,mi,ed,md,ri,pi,rd,pd,x={})=>({h,n:[h[0],h[1]+28],c:[100,172],ei,mi,ed,md,ri,pi,rd,pd,
      m:x.m??.6,q:x.q??0,gt:x.gt??0,cel:x.cel??0,est:x.est??0,pun:x.pun??0,mos:x.mos??0,mir:x.mir??0});
    this.POSES={
      parado:P([100,52],[76,122],[72,168],[124,122],[128,168],[88,232],[80,292],[112,232],[120,292]),
      pensando:P([100,54],[78,128],[116,126],[126,116],[106,80],[88,232],[82,292],[112,232],[120,292],{m:0,q:1,mir:-1}),
      frustrado:P([100,60],[52,96],[80,48],[148,96],[120,48],[86,232],[76,292],[114,232],[124,292],{m:-1,gt:1,est:1}),
      senalando:P([104,52],[72,128],[90,166],[152,112],[196,84],[88,232],[80,292],[112,232],[120,292],{m:.8,pun:1,mir:1}),
      celular:P([100,60],[78,128],[98,120],[122,128],[104,120],[88,232],[82,292],[112,232],[118,292],{m:.2,cel:1,mir:0}),
      celebrando:P([100,50],[62,74],[42,24],[138,74],[158,24],[78,232],[64,292],[122,232],[136,292],{m:1,est:1}),
      mostrador:P([100,50],[66,138],[60,170],[134,138],[140,170],[88,232],[80,292],[112,232],[120,292],{m:.7,mos:1})
    };
    const flat=o=>[...o.h,...o.n,...o.c,...o.ei,...o.mi,...o.ed,...o.md,...o.ri,...o.pi,...o.rd,...o.pd,o.m,o.q,o.gt,o.cel,o.est,o.pun,o.mos,o.mir];
    this.flat=flat;
  },
  pose(e,i,n){
    const p=e.plantilla;
    if(p==="mito"||p==="antes_despues")return "frustrado";
    if(p==="chat")return "celular";
    if(p==="ticket"||p==="celdas")return "mostrador";
    if(p==="dato"||p==="grafico")return "senalando";
    if(p==="titular")return i===0?"pensando":(i>=n-1?"celebrando":(i%2?"senalando":"parado"));
    return i%2?"senalando":"parado";
  },
  anim(t){
    const es=DATA.escenas,n=es.length;let k=0;
    for(let i=0;i<n;i++)if(t>=es[i].ini-.001)k=i;
    const cur=this.POSES[this.pose(es[k],k,n)],prev=k?this.POSES[this.pose(es[k-1],k-1,n)]:cur;
    const b=k?spring(t-es[k].ini,160,13):1;
    const a=this.flat(prev),c=this.flat(cur),v=a.map((x,i)=>x+(c[i]-x)*b);
    const pt=(i)=>v[i*2]+","+v[i*2+1];
    // respiración: todo el cuerpo sube y baja un poco
    const R=this.R,bob=Math.sin(t*3)*2.5;
    const pts=(...ix)=>ix.map(pt).join(" ");
    // índices: 0 h,1 n,2 c,3 ei,4 mi,5 ed,6 md,7 ri,8 pi,9 rd,10 pd
    R.torso.setAttribute("points",pts(1,2));
    R.brI.setAttribute("points",pts(1,3,4));R.brD.setAttribute("points",pts(1,5,6));
    R.pI.setAttribute("points",pts(2,7,8));R.pD.setAttribute("points",pts(2,9,10));
    const hx=v[0],hy=v[1],m=v[22],mir=v[29];
    R.cab.setAttribute("cx",hx);R.cab.setAttribute("cy",hy);
    R.oi.setAttribute("cx",hx-9+mir*3);R.oi.setAttribute("cy",hy-4);R.od.setAttribute("cx",hx+9+mir*3);R.od.setAttribute("cy",hy-4);
    R.boca.setAttribute("d",`M${hx-9} ${hy+10} Q${hx} ${hy+10+m*9} ${hx+9} ${hy+10}`);
    const g=v[24],ph=(t*1.3)%1;
    R.gota.setAttribute("transform",`translate(${hx+34},${hy-18+ph*30})`);R.gota.style.opacity=g*(1-ph);
    R.gota2.setAttribute("transform",`translate(${hx-38},${hy-6+((ph+.5)%1)*30})`);R.gota2.style.opacity=g*(1-((ph+.5)%1));
    R.que.setAttribute("x",hx+34);R.que.setAttribute("y",hy+2+Math.sin(t*4)*4);R.que.style.opacity=v[23];
    R.cel.setAttribute("transform",`translate(${(v[8]+v[12])/2-3},${(v[9]+v[13])/2-4}) rotate(${-8+Math.sin(t*2)*3}) scale(1.7)`);R.cel.style.opacity=v[25];
    // chispas / líneas de tensión alrededor de la cabeza
    const s=v[26],w=Math.sin(t*14)*3;
    R.est.style.opacity=s;
    R.e1.setAttribute("d",`M${hx-48} ${hy-30+w} l-12 -10`);R.e2.setAttribute("d",`M${hx+48} ${hy-30-w} l12 -10`);
    R.e3.setAttribute("d",`M${hx-56} ${hy} l-16 0`);R.e4.setAttribute("d",`M${hx+56} ${hy} l16 0`);
    R.pun.setAttribute("transform",`translate(${v[12]+14},${v[13]}) rotate(${Math.sin(t*6)*6})`);R.pun.style.opacity=v[27];
    R.mos.style.opacity=v[28];
    R.suelo.style.opacity=.35*(1-v[28]);
    R.torso.parentNode.style.transform=`translateY(${bob}px)`;
  }
}
};

let ESC=[],PL=null,RA=null;
function construir(){
  const cont=document.getElementById("escenas");
  DATA.escenas.forEach(e=>{
    const raiz=div("escena","",cont);raiz.style.display="block";RA=raiz;
    const f=PLANTILLAS[e.plantilla]||PLANTILLAS.titular;
    const dur=e.fin-e.ini;
    const o=f(e,dur);
    ESC.push({e,raiz,o,dur,hl:[...raiz.querySelectorAll('.pal.hl')]});
  });
  // placa final
  const p=div("placa","",document.body);p.style.display="block";
  p.innerHTML=`<div class="logo"></div><div class="boton"></div><div class="web"></div><div class="link">Link en el perfil</div><div class="precio"></div>`;
  const bt=p.querySelector(".boton");bt.textContent=DATA.placa.llamado;bt.style.whiteSpace="nowrap";
  {let px=52;bt.style.fontSize=px+"px";const sp=document.createElement("span");sp.textContent=DATA.placa.llamado;bt.textContent="";bt.appendChild(sp);while(sp.offsetWidth>740&&px>28){px-=2;bt.style.fontSize=px+"px"}}
  p.querySelector(".web").textContent=DATA.placa.web;
  p.querySelector(".precio").textContent=DATA.placa.precio||"";
  PL={el:p,ini:DATA.placa.ini};
}
function frame(t){
  TM.anim(t);
  ESC.forEach((s,i)=>{
    const lt0=t-s.e.ini;
    const vis=lt0>=-.001&&t<s.e.fin+.12;
    s.raiz.style.display=vis?"block":"none";
    if(!vis)return;
    const lt=lt0+(i===0?.22:0);   // la primera escena ya viene "en marcha" desde el cuadro 1
    s.hl.forEach(w=>w.style.setProperty('--w',clamp((lt-.35)/.3)));
    s.o.upd(lt);
    // golpe de zoom al entrar + deriva lenta
    const punch=1+(MOV.tipo==="resorte"?.06:.025)*(1-spring(lt0,260,22));
    const ex=clamp((t-s.e.fin)/.12);
    s.raiz.style.transform=`scale(${(punch+.02*clamp(lt0/s.dur))*(1-.04*ex)})`;
    s.raiz.style.opacity=i===0&&lt0<.05?1:1-ex;
  });
  const pe=PL.el,tp=t-PL.ini;
  pe.style.display=tp>=0?"block":"none";
  if(tp>=0){
    const e=(sel,d,y=28)=>{const el=pe.querySelector(sel);const p=clamp((tp-d)/.3);el.style.opacity=p;el.style.transform=`translateY(${y*(1-p)}px)`};
    e(".logo",0,40);e(".boton",.25);e(".web",.4);e(".link",.55);e(".precio",.15);
    pe.style.opacity=clamp(tp/.15);
  }
}
async function iniciar(data){
  window.DATA=data;
  const T=data.tema;
  Object.entries(T.vars).forEach(([k,v])=>document.body.style.setProperty("--"+k,v));
  document.body.classList.add("t-"+T.nombre);
  MOV=T.mov;ESCALA=T.esc||1;
  if(MOV.giro>0)document.body.style.setProperty('--cw','868px');   // las cajas inclinadas no se pasan de la zona segura
  await Promise.all(Object.keys(data.fuentes).map(f=>document.fonts.load(`16px ${f}`)));
  await document.fonts.ready;
  TM=FONDOS[T.nombre];TM.build(document.getElementById("fondo"));
  construir();
  frame(0);
}
// chequeo de desbordes: elementos de la escena actual fuera de la zona segura (40–960 px de ancho, 150–1540 de alto)
function desbordes(){
  const mal=[];
  document.querySelectorAll(".escena,.placa").forEach(r=>{
    if(getComputedStyle(r).display==="none")return;
    r.querySelectorAll(".pal,.t,.num,.et,.tit,.burb,.paso,.caja,.cel,.etq,.mc,.ad,.tk,.hoja,.tx").forEach(el=>{
      const b=el.getBoundingClientRect();
      if(b.width===0)return;
      if(b.left<40||b.right>965||b.top<150||b.bottom>1300)mal.push([el.className,el.textContent.slice(0,30),Math.round(b.left),Math.round(b.right),Math.round(b.top),Math.round(b.bottom)]);
    });
  });
  return mal;
}
